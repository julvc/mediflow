server:
  port: 8080

spring:
  application:
    name: mediflow-api
  datasource:
    url: jdbc:postgresql://localhost:5432/mediflow
    username: postgres
    password: local
  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, no Hibernate
    open-in-view: false    # evita el patrón Open Session In View (antipatrón: N+1 escondidos en la vista)
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mediflow:
  jwt:
    secret: ${JWT_SECRET:mediflow-dev-secret-cambiar-en-produccion-32-caracteres-minimo}
    access-token-minutos: 15
    refresh-token-dias: 7
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  worker:
    # medi-python/worker_api.py — el mismo procesador de documentos que usa
    # medi-python/backend directo como libreria, pero Java no puede importar
    # Python, asi que lo llama por HTTP.
    base-url: ${WORKER_BASE_URL:http://localhost:8000}
