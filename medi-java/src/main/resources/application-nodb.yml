# Perfil activado por SPRING_PROFILES_ACTIVE=nodb (Día 1 GCP: primer deploy
# a Cloud Run SIN Cloud SQL todavía, para aislar "¿el contenedor arranca?"
# de "¿la base de datos conecta?"). Los servicios/controllers dependen
# directo de los repositorios JPA (Turno, Paciente, Profesional, Documento),
# así que excluir el DataSource o desactivar el escaneo de repositorios no
# funciona: igual falta el bean que algún servicio necesita. En vez de eso,
# se le da a JPA un DataSource real pero en memoria (H2) — arranca sin tocar
# Cloud SQL, aunque una consulta real fallaría (no hay tablas, ddl-auto=none).
# Flyway se desactiva porque sus migraciones son SQL de Postgres, no de H2.
spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:nodb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
