services:
  localstack:
    image: localstack/localstack
    ports: ["4566:4566"]
    environment:
      SERVICES: s3,lambda,dynamodb,iam,sts,secretsmanager,sqs,logs
      DEBUG: 1
      LOCALSTACK_AUTH_TOKEN: "ls-zUlUzAGa-wAlu-5002-lEya-ZiholANa0a0b"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment: { POSTGRES_PASSWORD: local, POSTGRES_DB: mediflow }
  # Postgres aparte para medi-python/backend — a proposito no comparte instancia
  # ni esquema con el Postgres de medi-java (que Flyway administra): son dos
  # backends independientes que resuelven el mismo dominio para comparar stacks,
  # no una sola app con dos lenguajes.
  postgres-python:
    image: postgres:16-alpine
    ports: ["5433:5432"]
    environment: { POSTGRES_PASSWORD: local, POSTGRES_DB: mediflow_python }