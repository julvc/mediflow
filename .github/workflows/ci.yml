name: CI

# Corre en cada PR contra main. Nunca despliega — solo valida. El deploy
# real vive en deploy.yml y solo se dispara con push a main (ver Día 9).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # requerido por WIF para el plan de terraform, aunque no haya apply

jobs:
  test-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      # Testcontainers necesita Docker — ya viene en los runners ubuntu-latest.
      - name: mvn test (Testcontainers contra Postgres real)
        working-directory: medi-java
        run: mvn -B test

  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Auth vía Workload Identity Federation (sin claves JSON)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: terraform fmt -check
        working-directory: mediflow-infra/gcp
        run: terraform fmt -check -recursive
      - name: terraform init
        working-directory: mediflow-infra/gcp
        run: terraform init
      - name: terraform plan
        working-directory: mediflow-infra/gcp
        run: terraform plan -var="project_id=${{ vars.GCP_PROJECT_ID }}"
